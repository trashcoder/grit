[package]
name = "grit"
version = "0.1.0"
edition = "2024"
description = "A native, cross-platform graphical Git client"
license = "MIT"

[dependencies]
eframe = { version = "0.31", features = ["default_fonts", "persistence"] }
git2 = "0.20"
ttf-parser = "0.25"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
