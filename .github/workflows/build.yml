name: Build desktop releases

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: grit-linux-x86_64
            binary: target/release/grit
          - os: windows-2025
            artifact: grit-windows-x86_64
            binary: target/release/grit.exe
            arch: x86_64
          - os: macos-15
            artifact: grit-macos-arm64
            binary: target/release/grit
            arch: arm64
          - os: macos-15-intel
            artifact: grit-macos-x86_64
            binary: target/release/grit
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.100.0
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config librsvg2-bin libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libasound2-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxrandr-dev libxi-dev libxfixes-dev libxext-dev libxrender-dev
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build release binary
        run: cargo build --locked --release
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: bash ./scripts/package-macos.sh
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: ./scripts/build-appimage.sh
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
      - name: Upload Windows portable package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: grit-windows-x86_64-portable
          path: dist/grit-windows-x86_64.zip
          if-no-files-found: error
      - name: Upload macOS app package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: grit-macos-${{ matrix.arch }}-app
          path: dist/grit-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Upload Linux AppImage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: grit-linux-AppImage-x86_64
          path: dist/grit-x86_64.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            release-assets/grit-linux-AppImage-x86_64/grit-x86_64.AppImage
            release-assets/grit-windows-x86_64-portable/grit-windows-x86_64.zip
            release-assets/grit-macos-arm64-app/grit-macos-arm64.zip
            release-assets/grit-macos-x86_64-app/grit-macos-x86_64.zip
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          case "$GITHUB_REF" in
            refs/heads/main)
              tag="dev.$GITHUB_RUN_NUMBER"
              title="Grit Dev $GITHUB_RUN_NUMBER"
              target=(--target "$GITHUB_SHA")
              flags=(--prerelease --latest=false)
              ;;
            refs/tags/*)
              tag="$GITHUB_REF_NAME"
              title="Grit $tag"
              target=(--verify-tag)
              flags=(--latest)
              if [[ "$tag" == *-* ]]; then
                flags=(--prerelease --latest=false)
              fi
              ;;
            *)
              exit 0
              ;;
          esac

          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false "${flags[@]}"
          else
            gh release create "$tag" "${assets[@]}" "${target[@]}" "${flags[@]}" \
              --title "$title" \
              --notes "Built from commit $GITHUB_SHA. [Workflow run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
          fi
